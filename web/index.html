  <!-- ── Pyodide (Python no browser) ──────────────────────────────────────── -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.27.5/full/pyodide.js"></script>
  <script>
    window._pyodideReady       = false;
    window._pyodide            = null;
    window._pyodideInitPromise = null;

    async function _initPyodide() {
      try {
        window._pyodide = await loadPyodide();
        await window._pyodide.loadPackage(['pandas']);
        window._pyodideReady = true;
        console.log('[Pyodide] pronto (pandas carregado).');
      } catch (e) {
        console.error('[Pyodide] falhou ao carregar:', e);
      }
    }

    /** Aguarda o Pyodide terminar de carregar e retorna true/false. */
    window.__copilotEnsurePyodide = async function() {
      try {
        if (window._pyodideInitPromise) await window._pyodideInitPromise;
        return window._pyodideReady === true;
      } catch (_) {
        return false;
      }
    };

    /** Retorna true quando o Pyodide terminou de carregar. */
    function isPyodideReady() {
      return window._pyodideReady === true;
    }

    /**
     * runPythonCode(code) — async, armazena resultado em window._pyResult.
     * getPyResult()       — sync, retorna o JSON armazenado.
     * Flutter aguarda runPythonCode, depois chama getPyResult para ler a saída.
     */
    window._pyResult = null;

    async function runPythonCode(code) {
      window._pyResult = null;
      if (!window._pyodideReady || !window._pyodide) {
        window._pyResult = JSON.stringify({
          success: false,
          output: 'Pyodide ainda não está pronto. Aguarde a inicialização...'
        });
        return;
      }
      try {
        // Carrega pacotes necessários ANTES de redirecionar stdout
        await window._pyodide.loadPackagesFromImports(code);

        // Configura matplotlib para backend Agg e tema escuro navy/cyan
        try {
          window._pyodide.runPython(`
import matplotlib as __mpl
__mpl.use('agg')
import matplotlib.pyplot as __plt
__mpl.rcParams.update({
    'text.color':        '#E0E0E0',
    'axes.labelcolor':   '#E0E0E0',
    'axes.edgecolor':    '#445566',
    'axes.facecolor':    '#0C1B30',
    'figure.facecolor':  '#0C1B30',
    'xtick.color':       '#AABBCC',
    'ytick.color':       '#AABBCC',
    'legend.facecolor':  '#142640',
    'legend.edgecolor':  '#334455',
    'legend.labelcolor': '#E0E0E0',
    'grid.color':        '#1E3854',
})
__plt.show = lambda *a, **kw: None
`);
        } catch (_) { /* matplotlib pode não estar disponível */ }

        // Redireciona stdout/stderr e suprime DeprecationWarnings
        window._pyodide.runPython(`
import sys as __sys, io as __io, warnings as __warnings
__warnings.filterwarnings('ignore', category=DeprecationWarning)
__buf = __io.StringIO()
__sys.stdout = __buf
__sys.stderr = __buf
`);

        let success = true;
        let errorMsg = '';
        try {
          window._pyodide.runPython(code);
        } catch (codeErr) {
          success = false;
          errorMsg = '\n[Exceção Python]\n' + (codeErr.message || String(codeErr));
        }

        const captured = window._pyodide.runPython('__buf.getvalue()');

        // Captura figuras matplotlib como imagens base64 PNG
        let plotsB64 = '';
        try {
          plotsB64 = window._pyodide.runPython(`
import base64 as __b64, io as __bio
import matplotlib.pyplot as __plt2
__plot_list = []
for __fnum in __plt2.get_fignums():
    __fig = __plt2.figure(__fnum)
    __bbuf = __bio.BytesIO()
    __fig.savefig(__bbuf, format='png', dpi=150, bbox_inches='tight',
                  facecolor='#0C1B30', edgecolor='none')
    __bbuf.seek(0)
    __plot_list.append(__b64.b64encode(__bbuf.read()).decode('utf-8'))
    __bbuf.close()
__plt2.close('all')
'|||'.join(__plot_list) if __plot_list else ''
`) || '';
        } catch (_) { /* matplotlib pode não estar disponível */ }

        const combined = (captured || '') + errorMsg;
        const finalOutput = plotsB64
          ? (combined.trim() !== ''
              ? combined + '\n__PLOT_DATA__\n' + plotsB64
              : '__PLOT_DATA__\n' + plotsB64)
          : (combined.trim() !== '' ? combined : '(sem saída)');

        window._pyResult = JSON.stringify({ success: success, output: finalOutput });
      } catch (e) {
        window._pyResult = JSON.stringify({
          success: false,
          output: 'Erro interno: ' + (e.message || String(e))
        });
      }
    }

    function getPyResult() {
      return window._pyResult;
    }

    // Também expõe a API legada __copilotRunPython para compatibilidade
    window.__copilotRunPython = async function(sourceCode) {
      await runPythonCode(sourceCode);
      const res = window._pyResult;
      if (!res) return '(sem saída)';
      try {
        const obj = JSON.parse(res);
        return obj.output || '(sem saída)';
      } catch (_) {
        return res;
      }
    };

    // Inicia carregamento imediatamente e guarda a promise para __copilotEnsurePyodide
    window._pyodideInitPromise = _initPyodide();
  </script>
  <!-- ─────────────────────────────────────────────────────────────────────── -->
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
