name: Deploy PPTX Web para GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'assets/presentation.pptx'
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      base_href:
        description: 'Base href (ex: /nome-do-repo/)'
        required: false
        default: '/'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Build Flutter Web (WASM)
        run: |
          BASE="${{ github.event.inputs.base_href || format('/{0}/', github.event.repository.name) }}"
          flutter build web \
            --wasm \
            --base-href "$BASE" \
            --release

      - name: Upload artifact para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
